# ============================
# ACTIONS
# ============================
action:
  - choose:

      # ---------------- Button 1 ----------------
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: pico_1_button_1_pressed
              - condition: trigger
                id: pico_2_button_1_pressed
              - condition: trigger
                id: pico_3_button_1_pressed
              - condition: trigger
                id: pico_4_button_1_pressed
              - condition: trigger
                id: pico_5_button_1_pressed
              - condition: trigger
                id: pico_6_button_1_pressed
              - condition: trigger
                id: pico_7_button_1_pressed
        sequence:
          - wait_for_trigger:
              - platform: device
                device_id: !input pico_1
                domain: lutron_caseta
                type: release
                subtype: button_1
              - platform: device
                device_id: !input pico_2
                domain: lutron_caseta
                type: release
                subtype: button_1
              - platform: device
                device_id: !input pico_3
                domain: lutron_caseta
                type: release
                subtype: button_1
              - platform: device
                device_id: !input pico_4
                domain: lutron_caseta
                type: release
                subtype: button_1
              - platform: device
                device_id: !input pico_5
                domain: lutron_caseta
                type: release
                subtype: button_1
              - platform: device
                device_id: !input pico_6
                domain: lutron_caseta
                type: release
                subtype: button_1
              - platform: device
                device_id: !input pico_7
                domain: lutron_caseta
                type: release
                subtype: button_1
            timeout:
              seconds: !input time_before_long_press
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wait.trigger == none }}"
                sequence: !input button1_hold_action
            default:
