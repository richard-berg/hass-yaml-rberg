  - platform: device
    device_id: !input pico_3
    domain: lutron_caseta
    type: press
    subtype: button_2
    id: pico_3_button_2_pressed
  - platform: device
    device_id: !input pico_3
    domain: lutron_caseta
    type: press
    subtype: button_3
    id: pico_3_button_3_pressed
  - platform: device
    device_id: !input pico_3
    domain: lutron_caseta
    type: press
