- id: '1787375078127'
  alias: Open Area Picos Bottom Double Click -> Lights Off
  description: 'Bottom/off double-click on any 4-button Pico in the Kitchen, Dining,
    Living, Foyer, and Stage open-floor-plan meta-area turns off all open-area lights.
    Bathrooms, bedroom, and theater are intentionally separate.


    Uses the richardberg/lutron_pico_scene_actions_7 blueprint, which measures the
    double-click window from button RELEASE rather than press.


    time_before_double_click is raised to 500ms (blueprint default is 300ms) because
    these Picos are natively associated with lights in the Lutron app. Measured on
    the Air Fryer Pico: press->release is 371ms on an associated Pico versus 162ms
    on the unassociated bedroom Picos, because the bridge runs its own hold-to-dim
    arbitration before reporting release. That 210ms comes out of the double-click
    budget. A real double-click measured release->press2 of 310ms and missed the 300ms
    window by 8ms. 500ms restores comfortable margin. Raising this costs nothing today
    since button4_press_action is empty; if a short-press action is ever bound here
    it will be delayed by up to 500ms.


    Living Room Pico On Alli''s Desk (a112ee9fb703377cbc93993dcbdf61ef) is deliberately
    NOT included: it is a PJ2-3BRL 3-button raise/lower, not a PJ2-4B 4-button scene
    Pico, so it cannot be an input to this blueprint.'
  use_blueprint:
    input:
      button4_doubleclick_action:
      - action: script.open_area_lights_off
      pico_1: 4f8e4c8f2197505c7d5815c5a0fc7bcd
      pico_2: 71d5577f22453b64c6a4338f05625de4
      pico_3: 03f508a85f939b44da3e0ad0ca79ac84
      pico_4: 4fcf0a73682740a4779a67f1c86b983c
      pico_5: d544f522d60e6d7ed7806a6f1a4cd338
      pico_6: dc309e52227cea159ee8df1cd7095033
      pico_7: f3d4e7bb9bf4801526b01ca7e0a90379
      time_before_double_click: 500
    path: richardberg/lutron_pico_scene_actions_7.yaml
