- id: '1753065101071'
  alias: Projector State(s) -> Hushbox Fans
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - media_player.pt_rz660
  - trigger: state
    entity_id:
    - sensor.jvc_projector_power_status
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: media_player.pt_rz660
        state:
        - playing
      - type: is_on
        condition: device
        device_id: 33f818a96184e965cd8c56eb0eba63ab
        entity_id: eeaa889b075ac5218a96bf4f8b606d3f
        domain: binary_sensor
      sequence:
      - action: script.av_rack_fan_power
        metadata: {}
        data:
          send_persistent: true
          fan_power: 6
          fan_numbers:
          - number.pj_box_exhaust_port_1_on_power
          - number.pj_box_exhaust_port_2_on_power
          notify_devices:
          - c4f2d6ae1c0c3da84ec3e3b86712daf7
    - conditions:
      - condition: state
        entity_id: media_player.pt_rz660
        state:
        - 'on'
        - playing
      sequence:
      - action: script.av_rack_fan_power
        metadata: {}
        data:
          send_persistent: true
          fan_power: 4
          fan_numbers:
          - number.pj_box_exhaust_port_1_on_power
          - number.pj_box_exhaust_port_2_on_power
          notify_devices:
          - c4f2d6ae1c0c3da84ec3e3b86712daf7
    - conditions:
      - type: is_on
        condition: device
        device_id: 33f818a96184e965cd8c56eb0eba63ab
        entity_id: eeaa889b075ac5218a96bf4f8b606d3f
        domain: binary_sensor
      sequence:
      - action: script.av_rack_fan_power
        metadata: {}
        data:
          send_persistent: true
          fan_power: 2
          fan_numbers:
          - number.pj_box_exhaust_port_1_on_power
          - number.pj_box_exhaust_port_2_on_power
          notify_devices:
          - c4f2d6ae1c0c3da84ec3e3b86712daf7
    default:
    - delay:
        hours: 0
        minutes: 4
        seconds: 0
        milliseconds: 0
    - if:
      - condition: device
        type: is_off
        device_id: 33f818a96184e965cd8c56eb0eba63ab
        entity_id: cd0935d6bbb3c8258216dfa0d774c352
        domain: remote
      - condition: state
        entity_id: media_player.pt_rz660
        state:
        - 'off'
      then:
      - action: script.av_rack_fan_power
        metadata: {}
        data:
          send_persistent: true
          fan_power: 0
          fan_numbers:
          - number.pj_box_exhaust_port_1_on_power
          - number.pj_box_exhaust_port_2_on_power
  mode: restart
