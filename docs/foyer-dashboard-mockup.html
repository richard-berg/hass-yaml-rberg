<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foyer iPad Dashboard Mockup</title>
  <style>
    :root {
      --stone-50: #f8f3eb;
      --stone-100: #eee5d7;
      --stone-150: #e5d8c6;
      --stone-250: #cbbba4;
      --ink-900: #141311;
      --ink-760: #302d28;
      --ink-600: #5b554b;
      --ink-450: #81786a;
      --brass-500: #b98135;
      --brass-650: #825822;
      --olive-500: #667153;
      --blue-500: #4f758b;
      --rain-500: #3c7fa1;
      --green-500: #2f7252;
      --red-500: #a24335;
      --panel: rgba(255, 251, 243, 0.9);
      --panel-solid: #fffaf0;
      --panel-dark: #1d1b18;
      --hairline: rgba(20, 19, 17, 0.15);
      --shadow: 0 16px 48px rgba(35, 30, 22, 0.16);
      --gloss: inset 0 1px 0 rgba(255, 255, 255, 0.9), inset 0 -18px 38px rgba(85, 62, 28, 0.04);
      --radius-panel: 10px;
      --radius-control: 8px;
      --sans: "Aptos Display", "Avenir Next", "DIN Alternate", "Trebuchet MS", sans-serif;
      --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink-900);
      font-family: var(--sans);
      letter-spacing: 0;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(203, 187, 164, 0.24)),
        repeating-linear-gradient(0deg, rgba(20, 19, 17, 0.026) 0, rgba(20, 19, 17, 0.026) 1px, transparent 1px, transparent 8px),
        var(--stone-100);
    }

    button {
      cursor: default;
    }

    .ipad-frame {
      width: min(1366px, 100%);
      aspect-ratio: 4 / 3;
      padding: 18px;
      border-radius: 28px;
      background:
        linear-gradient(145deg, #37332e, #0f0e0d 64%, #292722),
        var(--panel-dark);
      box-shadow: 0 30px 80px rgba(22, 20, 16, 0.35);
    }

    .screen {
      position: relative;
      display: grid;
      grid-template-columns: minmax(340px, 35%) 1fr;
      gap: 18px;
      width: 100%;
      height: 100%;
      padding: 22px;
      overflow: hidden;
      border-radius: 18px;
      background:
        radial-gradient(circle at 85% 12%, rgba(185, 129, 53, 0.14), transparent 34%),
        linear-gradient(90deg, rgba(248, 243, 235, 0.96), rgba(244, 236, 224, 0.92)),
        repeating-linear-gradient(90deg, rgba(40, 36, 30, 0.03) 0, rgba(40, 36, 30, 0.03) 1px, transparent 1px, transparent 10px),
        var(--stone-50);
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 16px;
      pointer-events: none;
      border: 1px solid rgba(20, 19, 17, 0.08);
      border-radius: 14px;
    }

    .panel {
      position: relative;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-panel);
      background: var(--panel);
      box-shadow: var(--gloss), var(--shadow);
      overflow: hidden;
    }

    .panel::after,
    .route-card::after,
    .art-card::after {
      content: "";
      position: absolute;
      right: 13px;
      bottom: 13px;
      width: 8px;
      height: 8px;
      border-top: 2px solid rgba(20, 19, 17, 0.28);
      border-right: 2px solid rgba(20, 19, 17, 0.28);
      transform: rotate(45deg);
    }

    .no-drill::after,
    .nav::after {
      display: none;
    }

    .rail,
    .controls {
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .rail {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 12px;
    }

    .controls {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 14px;
    }

    .status-top {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
    }

    .time {
      font-family: var(--serif);
      font-size: 34px;
      line-height: 1;
      font-weight: 650;
    }

    .date {
      color: var(--ink-450);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .status-icons,
    .mode-icons,
    .nav-items {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-top .status-icons {
      justify-self: end;
    }

    .person-icon,
    .status-icon,
    .mode-icon,
    .nav-item {
      display: grid;
      place-items: center;
      border: 1px solid rgba(20, 19, 17, 0.13);
      background: rgba(255, 255, 255, 0.54);
      color: var(--ink-760);
    }

    .person-icon,
    .status-icon {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 900;
    }

    .person-icon {
      background: var(--panel-dark);
      color: var(--stone-50);
    }

    .person-icon::after,
    .status-icon::after,
    .mode-icon::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      width: 8px;
      height: 8px;
      border: 2px solid var(--panel-solid);
      border-radius: 999px;
      background: var(--green-500);
    }

    .status-icon.paused::after,
    .mode-icon::after {
      background: var(--brass-500);
    }

    .weather-card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 16px;
      padding: 16px;
      background:
        linear-gradient(145deg, rgba(255, 253, 247, 0.94), rgba(229, 216, 198, 0.76)),
        var(--panel-solid);
    }

    .weather-mark {
      display: grid;
      place-items: center;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 32%, #ffe3a0 0 18%, transparent 19%),
        radial-gradient(circle at 58% 58%, #d8edf4 0 36%, transparent 37%),
        linear-gradient(145deg, #f6c76d, #6ea5b9);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75), 0 12px 24px rgba(79, 117, 139, 0.22);
    }

    .weather-mark svg {
      width: 64px;
      height: 64px;
    }

    .weather-now {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .temp {
      font-size: 46px;
      line-height: 0.92;
      font-weight: 900;
    }

    .feels {
      color: var(--ink-450);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.25;
      text-transform: uppercase;
    }

    .weather-copy {
      margin-top: 7px;
      color: var(--ink-600);
      font-size: 15px;
      font-weight: 750;
    }

    .rain-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(20, 19, 17, 0.1);
    }

    .rain-any {
      color: var(--rain-500);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .rain-hours {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 184px;
      align-items: end;
    }

    .rain-hour {
      display: grid;
      grid-template-rows: 32px auto;
      gap: 4px;
      justify-items: center;
      color: var(--ink-450);
      font-size: 10px;
      font-weight: 850;
    }

    .rain-bar {
      width: 100%;
      align-self: end;
      border-radius: 999px 999px 2px 2px;
      background: linear-gradient(180deg, #7fb7cc, var(--rain-500));
      opacity: 0.9;
    }

    .transit-card {
      padding: 12px;
    }

    .transit-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
    }

    .transit-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 900;
    }

    .tiny-alert {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 7px;
      border: 1px solid rgba(20, 19, 17, 0.12);
      border-radius: 999px;
      color: var(--ink-450);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.5);
    }

    .route-list {
      display: grid;
      gap: 7px;
    }

    .route-card {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 58px;
      padding: 9px 26px 9px 10px;
      border: 1px solid rgba(20, 19, 17, 0.12);
      border-radius: var(--radius-control);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.66), rgba(239, 230, 214, 0.62));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    .route-card.best {
      border-color: rgba(185, 129, 53, 0.58);
      background: linear-gradient(145deg, rgba(255, 248, 235, 0.92), rgba(237, 219, 188, 0.76));
    }

    .line-badges {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .line {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      color: white;
      font-size: 15px;
      font-weight: 900;
      line-height: 1;
    }

    .line.green { background: #00933c; }
    .line.yellow { background: #fccc0a; color: #16120b; }
    .line.red { background: #ee352e; }
    .line.blue { background: #0039a6; }

    .route-main {
      min-width: 0;
    }

    .route-place {
      color: var(--ink-760);
      font-size: 15px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .route-next {
      margin-top: 2px;
      color: var(--ink-450);
      font-size: 12px;
      font-weight: 800;
    }

    .route-time {
      color: var(--ink-900);
      font-size: 26px;
      font-weight: 950;
      line-height: 1;
      text-align: right;
    }

    .route-time span {
      display: block;
      color: var(--ink-450);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .micro-status {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      justify-self: start;
      gap: 8px;
      padding: 8px;
    }

    .micro-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .micro-copy {
      color: var(--ink-450);
      font-size: 12px;
      font-weight: 850;
      text-transform: uppercase;
    }

    .control-layout {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 14px;
      height: 100%;
      min-width: 0;
    }

    .lighting-panel {
      display: grid;
      align-content: stretch;
      min-height: 286px;
      padding: 18px;
    }

    .lighting-shell {
      display: grid;
      grid-template-rows: auto auto;
      gap: 14px;
      height: 100%;
    }

    .scope-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .scope-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .lighting-icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: linear-gradient(145deg, #2d2923, #151310);
      color: #f1bd69;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 10px 18px rgba(39, 31, 20, 0.16);
    }

    .lighting-icon svg {
      width: 23px;
      height: 23px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .room-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .room-chip {
      display: grid;
      place-items: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(20, 19, 17, 0.88);
      color: var(--stone-50);
      font-size: 14px;
      font-weight: 900;
    }

    .scope-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 11px;
      border: 1px solid rgba(20, 19, 17, 0.16);
      border-radius: 999px;
      background: var(--panel-dark);
      color: var(--stone-50);
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .toggle-light {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: var(--brass-500);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .scene-buttons {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .scene-button {
      display: grid;
      align-content: space-between;
      min-height: 166px;
      padding: 16px;
      border: 1px solid rgba(20, 19, 17, 0.14);
      border-radius: var(--radius-control);
      background: linear-gradient(150deg, rgba(255, 255, 255, 0.78), rgba(232, 222, 205, 0.7));
      color: var(--ink-900);
      font: inherit;
      text-align: left;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82), 0 8px 16px rgba(43, 36, 24, 0.08);
    }

    .scene-button strong {
      font-size: 28px;
      line-height: 1.15;
      font-weight: 950;
      white-space: nowrap;
    }

    .scene-level {
      display: flex;
      gap: 4px;
      align-items: end;
      height: 32px;
    }

    .scene-level i {
      display: block;
      width: 8px;
      border-radius: 999px 999px 2px 2px;
      background: var(--brass-500);
    }

    .scene-button.active {
      background: linear-gradient(150deg, #211e19, #3f3527);
      color: var(--stone-50);
    }

    .scene-button.off strong {
      color: var(--red-500);
    }

    .art-card {
      position: relative;
      display: grid;
      grid-row: 2;
      min-height: 212px;
      padding: 14px;
      background:
        linear-gradient(145deg, rgba(255, 253, 247, 0.95), rgba(226, 216, 199, 0.82)),
        repeating-linear-gradient(135deg, rgba(20, 19, 17, 0.03) 0, rgba(20, 19, 17, 0.03) 1px, transparent 1px, transparent 13px),
        var(--panel-solid);
    }

    .art-mat {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      min-height: 100%;
      padding: 14px 18px;
      border: 1px solid rgba(20, 19, 17, 0.13);
      border-radius: 7px;
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 251, 243, 0.9), transparent 45%),
        linear-gradient(145deg, rgba(248, 243, 235, 0.88), rgba(203, 187, 164, 0.42)),
        repeating-linear-gradient(135deg, rgba(20, 19, 17, 0.032) 0, rgba(20, 19, 17, 0.032) 1px, transparent 1px, transparent 12px);
      overflow: hidden;
    }

    .art-mat::before {
      content: "";
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(20, 19, 17, 0.08);
      border-radius: 6px;
      pointer-events: none;
    }

    .print-frame {
      position: relative;
      width: 168px;
      aspect-ratio: 4 / 5;
      padding: 10px;
      border-radius: 6px;
      background: linear-gradient(145deg, #11100e, #3c3328 54%, #15130f);
      box-shadow:
        0 22px 42px rgba(34, 29, 21, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        inset 0 -1px 0 rgba(0, 0, 0, 0.46);
      transform: none;
    }

    .print-frame::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(185, 129, 53, 0.48);
      border-radius: 3px;
      pointer-events: none;
      z-index: 2;
    }

    .photo-window {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 3px;
      background: #d8c8ad;
    }

    .photo-window img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: 50% 47%;
      filter: grayscale(0.72) sepia(0.28) saturate(0.82) contrast(1.1) brightness(1.04);
      transform: scale(1.03);
    }

    .photo-window::before,
    .photo-window::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .photo-window::before {
      background:
        linear-gradient(145deg, rgba(255, 245, 224, 0.26), rgba(53, 43, 31, 0.18)),
        radial-gradient(circle at 50% 35%, transparent 35%, rgba(22, 19, 14, 0.28) 100%);
      mix-blend-mode: multiply;
    }

    .photo-window::after {
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28), inset 0 0 34px rgba(20, 19, 17, 0.28);
      background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.045) 0, rgba(255, 255, 255, 0.045) 1px, transparent 1px, transparent 5px);
      opacity: 0.58;
    }

    .mode-dock {
      display: grid;
      grid-template-columns: 1fr;
      align-content: start;
      gap: 10px;
      flex: 0 1 auto;
      padding: 12px;
    }

    .bottom-dock {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      grid-row: 4;
      min-width: 0;
    }

    .mode-block {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mode-label {
      color: var(--ink-450);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .mode-icons {
      gap: 8px;
      flex-wrap: nowrap;
    }

    .mode-icon {
      position: relative;
      grid-auto-flow: column;
      gap: 6px;
      width: auto;
      min-width: 76px;
      height: 40px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      font: inherit;
      font-size: 12px;
      font-weight: 900;
    }

    .mode-icon svg,
    .status-icon svg,
    .nav-item svg {
      width: 23px;
      height: 23px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mode-icon svg {
      width: 20px;
      height: 20px;
    }

    .media-mini {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid rgba(20, 19, 17, 0.1);
      border-radius: var(--radius-control);
      background: rgba(255, 255, 255, 0.5);
      color: var(--ink-600);
      font-size: 13px;
      font-weight: 850;
    }

    .media-mini strong {
      color: var(--ink-900);
      font-size: 15px;
    }

    .media-actions {
      display: flex;
      gap: 7px;
    }

    .small-button {
      min-height: 36px;
      min-width: 62px;
      padding: 8px 10px;
      border: 1px solid rgba(20, 19, 17, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.54);
      color: var(--ink-760);
      font: inherit;
      font-size: 13px;
      font-weight: 900;
    }

    .nav {
      flex: 0 0 auto;
      width: auto;
      padding: 6px;
    }

    .nav-items {
      justify-content: flex-end;
      gap: 6px;
    }

    .nav-item {
      min-width: 70px;
      height: 36px;
      grid-auto-flow: column;
      gap: 5px;
      padding: 0 8px;
      border-radius: 999px;
      color: var(--ink-600);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .nav-item.active {
      background: var(--panel-dark);
      color: var(--stone-50);
    }

    @media (max-width: 920px) {
      body {
        padding: 12px;
      }

      .ipad-frame {
        aspect-ratio: auto;
        min-height: 980px;
      }

      .screen,
      .control-layout {
        grid-template-columns: 1fr;
      }

      .screen {
        overflow-y: auto;
      }

      .controls,
      .rail,
      .control-layout {
        grid-template-rows: auto;
      }

      .mode-dock,
      .nav {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <main class="ipad-frame" aria-label="Foyer dashboard static mockup">
    <section class="screen">
      <aside class="rail" aria-label="Status and transit">
        <section class="panel no-drill status-top" aria-label="Current time and people status">
          <div>
            <div class="time">7:42</div>
            <div class="date">Sat Aug 22</div>
          </div>
          <div class="status-icons" aria-label="People status">
            <span class="person-icon" title="Richard home">R</span>
            <span class="person-icon" title="Allison home">A</span>
          </div>
        </section>

        <section class="panel weather-card" aria-label="Weather">
          <div class="weather-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <circle cx="24" cy="22" r="10" fill="#f3b343" stroke="none"/>
              <path d="M19 43h27c7 0 11-4 11-10s-5-10-12-10c-3-8-16-9-20-1-8 0-14 5-14 12 0 6 3 9 8 9Z" fill="#edf7fa" stroke="#2e6074"/>
              <path d="M25 49v5M36 49v5M47 49v5" stroke="#3c7fa1"/>
            </svg>
          </div>
          <div>
            <div class="weather-now">
              <span class="temp">72</span>
              <span class="feels">Feels 74<br>Wind 6</span>
            </div>
            <div class="weather-copy">Clouds now, showers possible later</div>
            <div class="rain-summary">
              <div class="rain-any">42% next 18h</div>
              <div class="rain-hours" aria-label="Hourly precipitation chance">
                <div class="rain-hour"><span class="rain-bar" style="height: 4px;"></span><span>8</span></div>
                <div class="rain-hour"><span class="rain-bar" style="height: 8px;"></span><span>10</span></div>
                <div class="rain-hour"><span class="rain-bar" style="height: 15px;"></span><span>12</span></div>
                <div class="rain-hour"><span class="rain-bar" style="height: 26px;"></span><span>2</span></div>
                <div class="rain-hour"><span class="rain-bar" style="height: 18px;"></span><span>4</span></div>
                <div class="rain-hour"><span class="rain-bar" style="height: 7px;"></span><span>6</span></div>
              </div>
            </div>
          </div>
        </section>

        <section class="panel transit-card" aria-label="Uptown transit status">
          <div class="transit-head">
            <div class="transit-title">
              <svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true">
                <path d="M12 4v16M6 10l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Uptown
            </div>
            <span class="tiny-alert">1 advisory</span>
          </div>
          <div class="route-list">
            <article class="route-card best">
              <div class="line-badges"><span class="line green">4</span><span class="line green">5</span></div>
              <div class="route-main"><div class="route-place">Fulton</div><div class="route-next">6, 14, 23</div></div>
              <div class="route-time">18<span>min</span></div>
            </article>
            <article class="route-card">
              <div class="line-badges"><span class="line yellow">R</span><span class="line yellow">W</span></div>
              <div class="route-main"><div class="route-place">Cortlandt</div><div class="route-next">10, 18, 31</div></div>
              <div class="route-time">24<span>min</span></div>
            </article>
            <article class="route-card">
              <div class="line-badges"><span class="line red">2</span><span class="line red">3</span></div>
              <div class="route-main"><div class="route-place">Park Pl</div><div class="route-next">12, 22, 32</div></div>
              <div class="route-time">27<span>min</span></div>
            </article>
          </div>
        </section>

        <section class="panel no-drill micro-status" aria-label="Compact status">
          <div class="micro-group">
            <span class="status-icon" title="No alerts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
          </div>
        </section>
      </aside>

      <section class="controls" aria-label="Controls and detail surfaces">
        <section class="control-layout">
          <section class="panel lighting-panel" aria-label="Open Area lighting controls">
            <div class="lighting-shell">
              <div class="scope-strip">
                <div class="scope-left">
                  <span class="lighting-icon" title="Lighting" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M8 14c-1.4-1.2-2-2.7-2-4.5A6 6 0 0 1 18 9.5c0 1.8-.7 3.3-2 4.5-.8.7-1 1.4-1 2H9c0-.6-.2-1.3-1-2Z"/></svg>
                  </span>
                  <div class="room-list" aria-label="Kitchen, Dining, Foyer">
                    <span class="room-chip">Kitchen</span>
                    <span class="room-chip">Dining</span>
                    <span class="room-chip">Foyer</span>
                  </div>
                </div>
                <span class="scope-toggle"><span class="toggle-light"></span>Living</span>
              </div>
              <div class="scene-buttons">
                <button class="scene-button active">
                  <strong>Everyday</strong>
                  <span class="scene-level"><i style="height: 12px;"></i><i style="height: 18px;"></i><i style="height: 25px;"></i></span>
                </button>
                <button class="scene-button">
                  <strong>Mood</strong>
                  <span class="scene-level"><i style="height: 6px;"></i><i style="height: 11px;"></i><i style="height: 16px;"></i></span>
                </button>
                <button class="scene-button off">
                  <strong>Off</strong>
                  <span class="scene-level"><i style="height: 3px; background: var(--red-500);"></i></span>
                </button>
              </div>
            </div>
          </section>

          <section class="panel art-card" aria-label="Dog art/photo treatment concept">
            <div class="art-mat">
              <div class="media-mini" aria-label="Living Room Sonos compact control">
                <strong>Sonos</strong>
                <span>Paused - Morning playlist</span>
                <div class="media-actions">
                  <button class="small-button">Play</button>
                  <button class="small-button">Off</button>
                </div>
              </div>
              <figure class="print-frame" aria-label="Framed processed dog photo from the current Foyer dashboard">
                <div class="photo-window">
                  <img src="../image/7abddc82be6cd368867697a7e0ac5a3c/original" alt="Dog photo used on the current Foyer dashboard" decoding="async">
                </div>
              </figure>
            </div>
          </section>

          <div class="bottom-dock">
            <section class="panel no-drill mode-dock" aria-label="House mode shortcuts">
              <div class="mode-block">
                <div class="mode-label">Modes</div>
                <div class="mode-icons" aria-label="Reserved mode toggles">
                  <button class="mode-icon" title="Guest" aria-label="Guest mode reserved">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V6h10v14M14 11h6v9M9 12h.01"/></svg><span>Guest</span>
                  </button>
                  <button class="mode-icon" title="Party" aria-label="Party mode reserved">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.4 4.9L20 9l-4 3.9.9 5.6L12 15.9l-4.9 2.6.9-5.6L4 9l5.6-1.1L12 3Z"/></svg><span>Party</span>
                  </button>
                  <button class="mode-icon" title="Performance" aria-label="Performance mode reserved">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 20h10M12 16v4M5 4h14l-2 12H7L5 4Z"/></svg><span>Perf</span>
                  </button>
                </div>
              </div>
            </section>

            <nav class="panel no-drill nav" aria-label="Dashboard tabs">
              <div class="nav-items">
                <span class="nav-item active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7v9H5v-9"/></svg>Home</span>
                <span class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18h16M7 18V9m5 9V5m5 13v-6"/></svg>Power</span>
                <span class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M6 9h12M8 15h8"/></svg>Climate</span>
                <span class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10H7zM17 10h2v4h-2"/></svg>Health</span>
              </div>
            </nav>
          </div>
        </section>
      </section>
    </section>
  </main>
</body>
</html>
