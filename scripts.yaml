    metadata: {}
    target:
      entity_id: switch.ap7902_outlet_12_vertical_pdu_players
    data: {}
  - variables:
      seconds_since_remote_change: '{{ (as_timestamp(now()) - as_timestamp(states.remote.home_theater.last_changed))
