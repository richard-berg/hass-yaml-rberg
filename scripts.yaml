        timeout: 00:00:01
        continue_on_timeout: true
      - wait_template: '{{ is_state(''script.play_sonos_on_stage'', ''off'') }}'
        timeout: 00:01:00
        continue_on_timeout: false
  - action: tts.speak
    metadata: {}
    target:
