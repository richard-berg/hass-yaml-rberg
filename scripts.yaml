theater_off:
  sequence:
  - parallel:
    - action: switch.turn_off
      metadata: {}
      target:
        entity_id:
        - switch.ap7902_outlet_04_orei_hdmi_splitter
      data: {}
    - action: media_player.turn_off
      metadata: {}
      target:
        entity_id:
        - media_player.pt_rz660
        - media_player.home_theater
      data: {}
    - action: remote.turn_off
      metadata: {}
      target:
        entity_id:
        - remote.kaleidescape_strato_0509_00010116
        - remote.jvc_projector
      data: {}
    - action: input_boolean.turn_off
      metadata: {}
      target:
        entity_id: input_boolean.all_amplifiers
      data: {}
    - action: button.press
      metadata: {}
      target:
        entity_id: button.lumagen_power_off_via_harmony_ir
      data: {}
    - action: script.turn_off_ugoos
      metadata: {}
      data: {}
  alias: Theater Off (except Trinnov)
  description: ''
turn_off_ugoos:
  sequence:
  - action: homeassistant.update_entity
    metadata: {}
    data:
      entity_id:
      - media_player.coreelec
  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 0
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.kodi_power_state
    data: {}
  alias: Turn off Ugoos
  description: ''
play_appletv_on_panasonic_pj:
  sequence:
  - parallel:
    - action: script.turn_on_pt_rz660_wait
      metadata: {}
      data: {}
    - action: switch.turn_on
      metadata: {}
      target:
        entity_id: switch.ap7902_outlet_04_orei_hdmi_splitter
      data: {}
    - action: script.turn_on_lumagen_wait
      metadata: {}
      data: {}
    - sequence:
      - action: script.turn_on_trinnov_wait
        metadata: {}
        data: {}
      - action: select.select_option
        metadata: {}
        target:
          entity_id: select.jbl_sdp_75_12583992_source
        data:
          option: AppleTV
    - action: script.turn_on_appletv_ht_wait
      metadata: {}
      data: {}
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - action: script.fix_lumagen_memb
    metadata: {}
    data: {}
  alias: Play AppleTV on Panasonic PJ
  description: ''
turn_on_appletv_ht_wait:
  sequence:
  - action: switch.turn_on
    metadata: {}
    target:
      entity_id: switch.ap7902_outlet_12_vertical_pdu_players
    data: {}
  - variables:
      seconds_since_remote_change: '{{ (as_timestamp(now()) - as_timestamp(states.remote.home_theater.last_changed))
        | float }}

        '
      seconds_since_media_change: "{{ (as_timestamp(now()) - as_timestamp(states.media_player.home_theater.last_changed))
        | float }}        \n"
      remaining_delay: '{{ [10 - seconds_since_remote_change, 10 - seconds_since_media_change,
        0] | max }}

        '
  - delay:
      seconds: '{{ remaining_delay }}'
  - if:
    - condition: state
      entity_id: remote.home_theater
      state:
      - 'off'
    then:
    - action: remote.turn_on
      metadata: {}
      target:
        entity_id: remote.home_theater
      data: {}
    - delay:
        hours: 0
        minutes: 0
        seconds: 1
        milliseconds: 0
  - if:
    - condition: template
      value_template: '{{ states(''media_player.home_theater'') not in (''off'', ''unknown'',
        ''unavailable'') }}'
    then:
    - stop: AppleTV already on
  - action: media_player.turn_on
    metadata: {}
    target:
      entity_id: media_player.home_theater
    data: {}
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  alias: Turn on AppleTV (HT) & Wait
  description: ''
toggle_trinnov_mute:
  sequence:
  - action: switch.toggle
    metadata: {}
    target:
      entity_id: switch.jbl_sdp_75_12583992_mute
    data: {}
  alias: Toggle Trinnov Mute
  description: ''
fix_lumagen_memb:
  sequence:
  - action: remote.send_command
    metadata: {}
    target:
      entity_id: remote.theater
    data:
      num_repeats: 1
      delay_secs: 0.4
      hold_secs: 0
      device: '82303834'
      command: MemB
  alias: Fix Lumagen (MemB)
  description: ''
open_area_lights_off:
  alias: Open Area Lights Off
  description: 'Turns off lights in the open-floor-plan meta-area: Kitchen, Foyer,
    Dining, Stage, and Living. Kitchen runs through script.kitchen_off so Hood Light
    behavior stays centralized; Stage Etc Off is the canonical Stage scene and supersedes
    Stage Off.'
  icon: mdi:floor-plan
  sequence:
  - parallel:
    - action: script.kitchen_off
      data: {}
    - action: scene.turn_on
      metadata: {}
      target:
        entity_id:
        - scene.dining_off
        - scene.stage_etc_off
        - scene.living_room_off
      data: {}
  - action: input_number.set_value
    metadata: {}
    target:
      entity_id: input_number.stage_uplights_brightness
    data:
      value: 0
  mode: single
foyer_dashboard_open_area_everyday:
  alias: Foyer Dashboard Open Area Everyday
  description: Set Kitchen, Dining, and Foyer to everyday/normal lighting in parallel;
    Kitchen runs through its behavior script so the Hood Light follows, and Living
    Room is included when the foyer dashboard helper is on.
  icon: mdi:lightbulb-group
  mode: restart
  sequence:
  - action: input_select.select_option
    target:
      entity_id: input_select.foyer_dashboard_lighting_intensity
    data:
      option: Everyday
  - parallel:
    - sequence:
      - action: script.kitchen_normal
    - sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.dining_normal
    - sequence:
      - if:
        - condition: state
          entity_id: input_boolean.foyer_dashboard_include_living
          state: 'on'
        then:
        - action: scene.turn_on
          target:
            entity_id: scene.living_room_normal
foyer_dashboard_open_area_off:
  alias: Foyer Dashboard Open Area Off
  description: Turn off Kitchen, Dining, and Foyer lighting in parallel; Kitchen runs
    through its behavior script so the Hood Light follows, and Living Room is included
    when the foyer dashboard helper is on.
  icon: mdi:lightbulb-group-off
  mode: restart
  sequence:
